<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Rápido ao Deploy Vercel</title>
    <!-- Carrega o Tailwind CSS CDN para estilo rápido e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7fafc; /* light gray background */
        }
        /* Estilos personalizados para o botão (efeito visual) */
        .deploy-button {
            transition: transform 0.1s ease-in-out, box-shadow 0.1s ease-in-out;
        }
        .deploy-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.5), 0 4px 6px -2px rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Card Principal -->
    <div class="bg-white p-8 md:p-10 rounded-xl shadow-2xl max-w-lg w-full text-center">
        
        <h1 class="text-3xl font-bold text-gray-800 mb-4">Projeto oMenu4</h1>
        
        <p class="text-gray-600 mb-8">
            Clique no botão abaixo para acessar o deploy de <strong>Produção </strong>.
        </p>

        <!-- Botão de Redirecionamento -->
        <a 
            href="https://o-menu4.vercel.app/" 
            target="_blank" 
            rel="noopener noreferrer"
            class="deploy-button inline-flex items-center justify-center 
                   px-8 py-3 text-lg font-semibold 
                   rounded-lg shadow-lg 
                   bg-gradient-to-r from-red-500 to-orange-500 
                   text-white 
                   hover:from-red-600 hover:to-orange-600 
                   focus:outline-none focus:ring-4 focus:ring-red-300">
            Acessar Deploy (Produção)
            <!-- Ícone de seta para indicar link externo -->
            <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0l-6 6"></path>
            </svg>
        </a>

        <p class="text-sm text-gray-400 mt-6">
            O link será aberto em uma nova aba.
        </p>
    </div>

</body>
</html>
